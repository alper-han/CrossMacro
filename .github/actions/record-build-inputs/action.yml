name: Record build inputs
description: Verify the checked-out source and upload the recorded build input metadata.
inputs:
  source-sha:
    description: Exact source commit the caller expects to have checked out.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        EXPECTED_SOURCE_SHA: ${{ inputs.source-sha }}
      run: python scripts/ci/record-build-metadata.py
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: build-inputs-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
        path: artifacts/build-metadata/inputs.json
        retention-days: 14
        if-no-files-found: error
