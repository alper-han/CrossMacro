version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      nuget:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /website
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      website:
        patterns: ['*']
