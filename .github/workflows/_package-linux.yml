name: Reusable Linux Packaging

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit validated by the caller.
        required: true
        type: string
      version:
        description: 'Package/application version to embed in Linux packages.'
        required: true
        type: string
      source_tag:
        description: 'Source tag associated with the package build.'
        required: true
        type: string
      canonical_version:
        description: 'Canonical package version used in package filenames.'
        required: true
        type: string
      artifact_prefix:
        description: 'Prefix for downloaded binary artifacts and uploaded package artifacts.'
        required: true
        type: string
      smoke_enabled:
        description: 'Run package smoke checks.'
        required: false
        default: true
        type: boolean
      release_mode:
        description: 'Whether this package build is running for release orchestration.'
        required: false
        default: false
        type: boolean
      upload_enabled:
        description: 'Upload Linux package artifacts.'
        required: false
        default: true
        type: boolean
      retention_days:
        description: 'Retention period for uploaded Linux package artifacts.'
        required: false
        default: 7
        type: number
      build_run_id:
        description: 'Workflow run ID suffix used by upstream Linux binary artifacts.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  package-deb:
    name: Build and Smoke DEB (${{ matrix.arch_suffix }})
    timeout-minutes: 45
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_suffix: x64
            runner: ubuntu-latest
            target_arch: x86_64
          - arch_suffix: arm64
            runner: ubuntu-24.04-arm
            target_arch: aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}

      - name: Download Linux UI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.artifact_prefix }}-ui-${{ matrix.arch_suffix }}-${{ inputs.build_run_id }}
          path: artifacts/input/publish/

      - name: Download Linux daemon artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.artifact_prefix }}-daemon-${{ matrix.arch_suffix }}-${{ inputs.build_run_id }}
          path: artifacts/input/publish-daemon/

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev patchelf

      - name: Build DEB package
        run: |
          VERSION="${{ inputs.version }}" \
          SOURCE_TAG="${{ inputs.source_tag }}" \
          PACKAGE_VERSION_CANONICAL="${{ inputs.canonical_version }}" \
          TARGET_ARCH="${{ matrix.target_arch }}" \
          PUBLISH_DIR="$PWD/artifacts/input/publish" \
          DAEMON_DIR="$PWD/artifacts/input/publish-daemon" \
          bash scripts/build_deb.sh

      - name: Smoke DEB package
        if: ${{ inputs.smoke_enabled }}
        env:
          CONTAINER_ENGINE: docker
        run: |
          set -euo pipefail
          deb_file="$(find artifacts/packages/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$deb_file"
          bash scripts/smoke/deb-package.sh "$deb_file" --image ubuntu:24.04

      - name: Upload DEB package
        if: ${{ inputs.upload_enabled }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact_prefix }}-deb-${{ matrix.arch_suffix }}-${{ github.run_id }}
          path: artifacts/packages/deb/*.deb
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
          compression-level: 0

  package-rpm:
    name: Build and Smoke RPM (${{ matrix.arch_suffix }})
    timeout-minutes: 45
    runs-on: ${{ matrix.runner }}
    container: docker.io/library/fedora:44
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_suffix: x64
            runner: ubuntu-latest
            target_arch: x86_64
            rpm_arch: x86_64
          - arch_suffix: arm64
            runner: ubuntu-24.04-arm
            target_arch: aarch64
            rpm_arch: aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}

      - name: Download Linux UI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.artifact_prefix }}-ui-${{ matrix.arch_suffix }}-${{ inputs.build_run_id }}
          path: artifacts/input/publish/

      - name: Download Linux daemon artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.artifact_prefix }}-daemon-${{ matrix.arch_suffix }}-${{ inputs.build_run_id }}
          path: artifacts/input/publish-daemon/

      - name: Select Fedora cache epoch
        id: fedora-cache
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache Fedora package downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: /var/cache/libdnf5
          key: fedora-44-${{ matrix.arch_suffix }}-dnf-v1-${{ steps.fedora-cache.outputs.week }}-${{ hashFiles('scripts/packaging/rpm/ci-packages.txt', 'scripts/packaging/rpm/crossmacro.spec') }}
          restore-keys: |
            fedora-44-${{ matrix.arch_suffix }}-dnf-v1-

      - name: Install Fedora packaging and runtime dependencies
        run: bash scripts/ci/setup-fedora-rpm.sh

      - name: Build RPM from prebuilt Linux binaries
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}" \
          SOURCE_TAG="${{ inputs.source_tag }}" \
          PACKAGE_VERSION_CANONICAL="${{ inputs.canonical_version }}" \
          TARGET_ARCH="${{ matrix.target_arch }}" \
          RPM_ARCH="${{ matrix.rpm_arch }}" \
          PUBLISH_DIR="$GITHUB_WORKSPACE/artifacts/input/publish" \
          DAEMON_DIR="$GITHUB_WORKSPACE/artifacts/input/publish-daemon" \
          bash scripts/build_rpm.sh

      - name: Smoke RPM package
        if: ${{ inputs.smoke_enabled }}
        run: |
          set -euo pipefail
          rpm_file="$(find artifacts/packages/rpm -maxdepth 1 -type f -name '*.rpm' -print -quit)"
          test -n "$rpm_file"
          bash scripts/smoke/rpm-package.sh "$rpm_file" --install-in-container

      - name: Upload RPM package
        if: ${{ inputs.upload_enabled }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact_prefix }}-rpm-${{ matrix.arch_suffix }}-${{ github.run_id }}
          path: artifacts/packages/rpm/*.rpm
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
          compression-level: 0

  package-appimage:
    name: Build and Smoke AppImage (${{ matrix.arch_suffix }})
    timeout-minutes: 45
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_suffix: x64
            runner: ubuntu-latest
            target_arch: x86_64
            appimage_arch: x86_64
            appimagetool_host_arch: x86_64
            appimagetool_sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
          - arch_suffix: arm64
            runner: ubuntu-24.04-arm
            target_arch: aarch64
            appimage_arch: aarch64
            appimagetool_host_arch: aarch64
            appimagetool_sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}

      - name: Download Linux UI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ inputs.artifact_prefix }}-ui-${{ matrix.arch_suffix }}-${{ inputs.build_run_id }}
          path: artifacts/input/publish/

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file desktop-file-utils patchelf jq pkg-config libxtst6 libicu-dev

      - name: Build AppImage
        run: |
          VERSION="${{ inputs.version }}" \
          SOURCE_TAG="${{ inputs.source_tag }}" \
          PACKAGE_VERSION_CANONICAL="${{ inputs.canonical_version }}" \
          TARGET_ARCH="${{ matrix.target_arch }}" \
          APPIMAGE_ARCH="${{ matrix.appimage_arch }}" \
          APPIMAGETOOL_HOST_ARCH="${{ matrix.appimagetool_host_arch }}" \
          APPIMAGETOOL_SHA256="${{ matrix.appimagetool_sha256 }}" \
          PUBLISH_DIR="$PWD/artifacts/input/publish" \
          APPIMAGE_EXTRACT_AND_RUN=1 \
          bash scripts/build_appimage.sh

      - name: Smoke AppImage
        if: ${{ inputs.smoke_enabled }}
        run: |
          set -euo pipefail
          appimage="$(find artifacts/packages/appimage -maxdepth 1 -type f -name '*-${{ matrix.appimage_arch }}.AppImage' -print -quit)"
          test -n "$appimage"
          chmod +x "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 bash scripts/smoke/appimage.sh "$appimage"

      - name: Upload AppImage package
        if: ${{ inputs.upload_enabled }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact_prefix }}-appimage-${{ matrix.arch_suffix }}-${{ github.run_id }}
          path: artifacts/packages/appimage/*-${{ matrix.appimage_arch }}.AppImage
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
          compression-level: 0
