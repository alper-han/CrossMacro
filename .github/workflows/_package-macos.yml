name: Reusable macOS Packaging

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source commit validated by the caller.
        required: true
        type: string
      version:
        description: 'Package/application version to embed in macOS packages.'
        required: true
        type: string
      source_tag:
        description: 'Source tag associated with release package builds.'
        required: false
        default: ''
        type: string
      canonical_version:
        description: 'Canonical package version used in macOS package filenames.'
        required: true
        type: string
      artifact_prefix:
        description: 'Prefix for uploaded macOS package artifacts.'
        required: true
        type: string
      smoke_enabled:
        description: 'Run macOS DMG smoke checks.'
        required: false
        default: true
        type: boolean
      release_mode:
        description: 'Whether this package build is running for release orchestration.'
        required: false
        default: false
        type: boolean
      upload_enabled:
        description: 'Upload macOS DMG artifacts.'
        required: false
        default: true
        type: boolean
      retention_days:
        description: 'Retention period for uploaded macOS DMG artifacts.'
        required: false
        default: 7
        type: number

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  package-macos-dmg:
    name: Build and Smoke macOS DMG (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-arm64
            target_arch: aarch64
            artifact_suffix: arm64
            runner: macos-latest
          - rid: osx-x64
            target_arch: x86_64
            artifact_suffix: x64
            runner: macos-26-intel

    timeout-minutes: 45
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}

      - name: Setup .NET
        id: dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('global.json', 'Directory.*', '**/*.csproj') }}
          restore-keys: |
            nuget-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.dotnet.outputs.dotnet-version }}-
      - name: Record and verify build inputs
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: python scripts/ci/record-build-metadata.py
      - name: Upload build input metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-inputs-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          path: artifacts/build-metadata/inputs.json
          retention-days: 14
          if-no-files-found: error

      - name: Install create-dmg
        run: |
          brew install create-dmg

      - name: Build DMG package
        run: |
          chmod +x scripts/build_macos.sh
          bash scripts/build_macos.sh
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ inputs.version }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          PACKAGE_VERSION_CANONICAL: ${{ inputs.canonical_version }}
          TARGET_ARCH: ${{ matrix.target_arch }}

      - name: Smoke DMG package
        if: ${{ inputs.smoke_enabled }}
        run: |
          set -euo pipefail
          chmod +x scripts/smoke/macos-dmg.sh
          dmg_file="$(find artifacts/packages/macos -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg_file"
          bash scripts/smoke/macos-dmg.sh "$dmg_file"

      - name: Upload macOS DMG artifact
        if: ${{ inputs.upload_enabled }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.release_mode && format('macos-{0}-package', matrix.artifact_suffix) || format('{0}-dmg-{1}-{2}', inputs.artifact_prefix, matrix.artifact_suffix, github.run_id) }}
          path: artifacts/packages/macos/*.dmg
          retention-days: ${{ inputs.retention_days }}
          if-no-files-found: error
          compression-level: 0
