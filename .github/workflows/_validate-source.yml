name: Reusable Source Validation

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:

  source-linux:
    name: Build and Test (Linux)
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.source_sha }}

    - name: Setup .NET
      id: dotnet
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: nuget-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('global.json', 'Directory.*', '**/*.csproj') }}
        restore-keys: |
          nuget-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.dotnet.outputs.dotnet-version }}-
    - name: Record and verify build inputs
      id: metadata
      env:
        EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      run: python scripts/ci/record-build-metadata.py
    - name: Ensure Linux test prerequisites
      run: |
        if ! command -v dbus-run-session >/dev/null || ! ldconfig -p | grep -F 'libfontconfig.so.1' >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus libfontconfig1
        fi

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Debug (reuse restored dependencies)
      id: build
      run: dotnet build --configuration Debug --no-restore

    - name: Run all test suites (reuse Debug build)
      run: python scripts/ci/run-tests.py Linux

    - name: CLI Smoke (Linux)
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: |
        bash scripts/smoke/cli-smoke.sh --command 'dotnet run --no-build --project src/CrossMacro.UI.Linux/CrossMacro.UI.Linux.csproj --'

    - name: CLI Daemon Smoke (Linux, env-gated)
      if: ${{ !cancelled() && steps.build.outcome == 'success' && vars.CROSSMACRO_LINUX_DAEMON_SMOKE == '1' }}
      run: |
        set -euo pipefail
        UI_PROJECT="src/CrossMacro.UI.Linux/CrossMacro.UI.Linux.csproj"
        DAEMON_PROJECT="src/CrossMacro.Daemon/CrossMacro.Daemon.csproj"

        dotnet run --no-build --project "$DAEMON_PROJECT" > daemon-smoke.log 2>&1 &
        daemon_pid=$!

        cleanup() {
          kill "$daemon_pid" 2>/dev/null || true
          wait "$daemon_pid" 2>/dev/null || true
        }
        trap cleanup EXIT

        for _ in $(seq 1 30); do
          if [ -S "/run/crossmacro/crossmacro.sock" ] || [ -S "/tmp/crossmacro.sock" ]; then
            break
          fi
          sleep 1
        done

        if ! [ -S "/run/crossmacro/crossmacro.sock" ] && ! [ -S "/tmp/crossmacro.sock" ]; then
          echo "Daemon socket was not created."
          cat daemon-smoke.log || true
          exit 1
        fi

        set +e
        doctor_output="$(dotnet run --no-build --project "$UI_PROJECT" -- doctor --json --verbose 2>&1)"
        doctor_code=$?
        set -e
        echo "$doctor_output"
        echo "doctor exit code: $doctor_code"
        echo "$doctor_output" | grep -F '"name": "linux-daemon-handshake"'
        echo "$doctor_output" | grep -F 'Daemon handshake probe succeeded.'

    - name: Upload test results
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: test-results-linux-${{ github.run_id }}
        path: artifacts/test-results/Linux/
        retention-days: 7
        if-no-files-found: ignore

    - name: Upload build input metadata
      if: ${{ !cancelled() && steps.metadata.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: build-inputs-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
        path: artifacts/build-metadata/inputs.json
        retention-days: 14
        if-no-files-found: error

  source-windows:
    name: Build and Test (Windows)
    timeout-minutes: 30
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.source_sha }}

    - name: Setup .NET
      id: dotnet
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: nuget-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('global.json', 'Directory.*', '**/*.csproj') }}
        restore-keys: |
          nuget-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.dotnet.outputs.dotnet-version }}-
    - name: Record and verify build inputs
      id: metadata
      env:
        EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      run: python scripts/ci/record-build-metadata.py
    - name: Restore dependencies
      run: dotnet restore

    - name: Build Debug (reuse restored dependencies)
      id: build
      run: dotnet build --configuration Debug --no-restore

    - name: Run all test suites (reuse Debug build)
      run: python scripts/ci/run-tests.py Windows

    - name: Validate MSIX prepare script idempotency
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: pwsh
      run: |
        $version = (Get-Content VERSION -Raw).Trim()
        $outputDir = Join-Path $env:RUNNER_TEMP "msix-prepare-test"
        Remove-Item -LiteralPath $outputDir -Recurse -Force -ErrorAction SilentlyContinue

        ./scripts/msix/prepare-msix.ps1 -Version $version -OutputDir $outputDir
        ./scripts/msix/prepare-msix.ps1 -Version $version -OutputDir $outputDir

        [xml]$manifest = Get-Content -LiteralPath (Join-Path $outputDir "AppxManifest.xml") -Raw
        $namespaceManager = New-Object System.Xml.XmlNamespaceManager($manifest.NameTable)
        $namespaceManager.AddNamespace("appx", "http://schemas.microsoft.com/appx/manifest/foundation/windows10")
        $identity = $manifest.SelectSingleNode("/appx:Package/appx:Identity", $namespaceManager)
        if ($null -eq $identity) {
          throw "Prepared manifest does not contain Identity node."
        }
        if ($identity.Version -ne "$version.0") {
          throw "Prepared manifest version '$($identity.Version)' does not match expected '$version.0'."
        }

        $defaultOutputDir = Join-Path (Get-Location) "artifacts/work/msix/content"
        Remove-Item -LiteralPath $defaultOutputDir -Recurse -Force -ErrorAction SilentlyContinue
        Push-Location $env:RUNNER_TEMP
        try {
          & "$env:GITHUB_WORKSPACE/scripts/msix/prepare-msix.ps1" -Version $version
          & "$env:GITHUB_WORKSPACE/scripts/msix/prepare-msix.ps1" -Version $version
        }
        finally {
          Pop-Location
        }

        if (-not (Test-Path -LiteralPath (Join-Path $defaultOutputDir "AppxManifest.xml") -PathType Leaf)) {
          throw "CWD-independent default MSIX output was not created at '$defaultOutputDir'."
        }
        Remove-Item -LiteralPath $defaultOutputDir -Recurse -Force

    - name: CLI Smoke (Windows)
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      shell: pwsh
      run: ./scripts/smoke/cli-smoke.ps1 -Project src/CrossMacro.UI.Windows/CrossMacro.UI.Windows.csproj

    - name: Setup Node.js for MCP Inspector
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      id: mcp-node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22

    - name: MCP Smoke (reuse Debug build)
      if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.mcp-node.outcome == 'success' }}
      timeout-minutes: 3
      shell: bash
      run: bash scripts/smoke/mcp-smoke.sh --command 'dotnet run --no-build --configuration Debug --project src/CrossMacro.UI.Windows/CrossMacro.UI.Windows.csproj -- mcp'

    - name: Upload test results
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: test-results-windows-${{ github.run_id }}
        path: artifacts/test-results/Windows/
        retention-days: 7
        if-no-files-found: ignore

    - name: Upload build input metadata
      if: ${{ !cancelled() && steps.metadata.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: build-inputs-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
        path: artifacts/build-metadata/inputs.json
        retention-days: 14
        if-no-files-found: error

  source-macos:
    name: Build and Test (macOS)
    timeout-minutes: 30
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.source_sha }}

    - name: Setup .NET
      id: dotnet
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
      with:
        dotnet-version: '10.0.x'

    - name: Cache NuGet downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: nuget-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('global.json', 'Directory.*', '**/*.csproj') }}
        restore-keys: |
          nuget-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ steps.dotnet.outputs.dotnet-version }}-
    - name: Record and verify build inputs
      id: metadata
      env:
        EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      run: python scripts/ci/record-build-metadata.py
    - name: Restore dependencies
      run: dotnet restore

    - name: Build Debug (reuse restored dependencies)
      id: build
      run: dotnet build --configuration Debug --no-restore

    - name: Run all test suites (reuse Debug build)
      run: python scripts/ci/run-tests.py MacOS

    - name: CLI Smoke (macOS)
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: |
        bash scripts/smoke/cli-smoke.sh --command 'dotnet run --no-build --project src/CrossMacro.UI.MacOS/CrossMacro.UI.MacOS.csproj --'

    - name: Setup Node.js for MCP Inspector
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      id: mcp-node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: 22

    - name: MCP Smoke (reuse Debug build)
      if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.mcp-node.outcome == 'success' }}
      timeout-minutes: 3
      shell: bash
      run: bash scripts/smoke/mcp-smoke.sh --command 'dotnet run --no-build --configuration Debug --project src/CrossMacro.UI.MacOS/CrossMacro.UI.MacOS.csproj -- mcp'

    - name: Upload test results
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: test-results-macos-${{ github.run_id }}
        path: artifacts/test-results/MacOS/
        retention-days: 7
        if-no-files-found: ignore

    - name: Upload build input metadata
      if: ${{ !cancelled() && steps.metadata.outcome == 'success' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: build-inputs-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
        path: artifacts/build-metadata/inputs.json
        retention-days: 14
        if-no-files-found: error
