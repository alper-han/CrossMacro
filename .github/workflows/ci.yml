name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-validation:
    name: Validate Workflow Syntax and Policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      desktop: ${{ steps.changes.outputs.desktop }}
      website: ${{ steps.changes.outputs.website }}
      version: ${{ steps.version.outputs.version }}
      source_tag: ${{ steps.version.outputs.source_tag }}
      canonical_version: ${{ steps.version.outputs.package_version_canonical }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Select validation scope
        id: changes
        run: python3 scripts/ci/workflow_policy.py select
      - name: Resolve package metadata
        id: version
        run: bash scripts/ci/resolve-release-metadata.sh --mode ci
      - name: Setup .NET for CI contracts
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Validate workflows and CI policy scenarios
        run: bash scripts/ci/validate-workflows.sh
      - name: Validate PowerShell scripts and MSIX staging
        shell: pwsh
        run: ./scripts/ci/test-powershell-scripts.ps1
      - name: Verify version synchronization
        run: |
          bash scripts/sync-version.sh --check
          VERSION="$(tr -d '\r\n[:space:]' < VERSION)" bash scripts/sync-version.sh --write
          git diff --exit-code -- scripts/packaging/arch/PKGBUILD scripts/msix/AppxManifest.xml flatpak/io.github.alper_han.crossmacro.flathub.yml
      - name: Validate man page source
        run: man -l docs/man/crossmacro.1 > /dev/null

  source-validation:
    name: Source Validation
    needs: workflow-validation
    if: needs.workflow-validation.outputs.desktop == 'true'
    uses: ./.github/workflows/_validate-source.yml
    with:
      source_sha: ${{ github.sha }}

  build-linux-binaries:
    name: Build Linux Binaries
    needs: workflow-validation
    if: needs.workflow-validation.outputs.desktop == 'true'
    uses: ./.github/workflows/_build-linux-binaries.yml
    with:
      source_sha: ${{ github.sha }}
      version: ${{ needs.workflow-validation.outputs.version }}
      source_tag: ${{ needs.workflow-validation.outputs.source_tag }}
      artifact_prefix: linux-packages
      retention_days: 3

  package-linux:
    name: Linux Packages
    needs: [workflow-validation, build-linux-binaries]
    if: needs.workflow-validation.outputs.desktop == 'true'
    uses: ./.github/workflows/_package-linux.yml
    with:
      source_sha: ${{ github.sha }}
      version: ${{ needs.workflow-validation.outputs.version }}
      source_tag: ${{ needs.workflow-validation.outputs.source_tag }}
      canonical_version: ${{ needs.workflow-validation.outputs.canonical_version }}
      artifact_prefix: linux-packages
      retention_days: 14
      build_run_id: ${{ github.run_id }}

  package-flatpak:
    name: Flatpak Packages
    needs: workflow-validation
    if: needs.workflow-validation.outputs.desktop == 'true'
    uses: ./.github/workflows/_package-flatpak.yml
    with:
      source_sha: ${{ github.sha }}
      version: ${{ needs.workflow-validation.outputs.version }}
      source_tag: ${{ needs.workflow-validation.outputs.source_tag }}
      canonical_version: ${{ needs.workflow-validation.outputs.canonical_version }}
      artifact_prefix: linux-packages
      retention_days: 14

  package-windows:
    name: Windows Packages
    needs: workflow-validation
    if: needs.workflow-validation.outputs.desktop == 'true'
    uses: ./.github/workflows/_package-windows.yml
    with:
      source_sha: ${{ github.sha }}
      version: ${{ needs.workflow-validation.outputs.version }}
      source_tag: ${{ needs.workflow-validation.outputs.source_tag }}
      canonical_version: ${{ needs.workflow-validation.outputs.canonical_version }}
      artifact_prefix: windows-packages
      retention_days: 14

  package-macos:
    name: macOS Packages
    needs: workflow-validation
    if: needs.workflow-validation.outputs.desktop == 'true'
    uses: ./.github/workflows/_package-macos.yml
    with:
      source_sha: ${{ github.sha }}
      version: ${{ needs.workflow-validation.outputs.version }}
      source_tag: ${{ needs.workflow-validation.outputs.source_tag }}
      canonical_version: ${{ needs.workflow-validation.outputs.canonical_version }}
      artifact_prefix: macos-packages
      retention_days: 14

  website:
    name: Validate Website
    needs: workflow-validation
    if: needs.workflow-validation.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Validate website build
        working-directory: website
        run: |
          npm ci
          npm run build

  release-readiness:
    name: Release Readiness
    needs: [workflow-validation, source-validation, build-linux-binaries, package-linux, package-flatpak, package-windows, package-macos]
    if: ${{ always() && needs.workflow-validation.outputs.desktop == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Require full desktop validation
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          DESKTOP: 'true'
        run: python3 scripts/ci/workflow_policy.py results --readiness

  quality-gate:
    name: CI Quality Gate
    needs: [workflow-validation, source-validation, build-linux-binaries, package-linux, package-flatpak, package-windows, package-macos, website, release-readiness]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
      - name: Require all selected checks
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          DESKTOP: ${{ needs.workflow-validation.outputs.desktop }}
          WEBSITE: ${{ needs.workflow-validation.outputs.website }}
        run: python3 scripts/ci/workflow_policy.py results
