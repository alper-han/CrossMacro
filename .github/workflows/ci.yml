name: COPR Dev Test

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source commit SHA with successful CI
        type: string
        required: true
        default: df5ef238491722c1290450e5d85c955c6586177b

permissions:
  contents: read
  actions: read

concurrency:
  group: copr-crossmacro-dev
  cancel-in-progress: false

jobs:
  copr-test:
    if: github.repository == 'alper-han/CrossMacro' && github.ref == 'refs/heads/crossmacro-copr'
    runs-on: ubuntu-latest
    container: docker.io/library/fedora:44
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Install COPR dependencies
        run: dnf install -y --setopt=install_weak_deps=False copr-cli gh git python3

      - name: Checkout workflow policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require successful CI for exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/workflow_policy.py verify-source-ci

      - name: Configure project and wait for COPR build
        env:
          COPR_CONFIG: ${{ runner.temp }}/crossmacro-copr-dev.conf
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +x
          set -euo pipefail
          trap 'rm -f "$COPR_CONFIG"' EXIT
          : "${COPR_LOGIN:?COPR_LOGIN must be configured}" "${COPR_TOKEN:?COPR_TOKEN must be configured}"
          for value in "$COPR_LOGIN" "$COPR_TOKEN"; do
            case "$value" in *$'\n'*|*$'\r'*) echo "COPR credentials must be single-line values" >&2; exit 2;; esac
          done
          umask 077
          install -m 0600 /dev/null "$COPR_CONFIG"
          printf '[copr-cli]\nlogin = %s\ntoken = %s\nusername = alperhan\ncopr_url = https://copr.fedorainfracloud.org\ngssapi = false\n' \
            "$COPR_LOGIN" "$COPR_TOKEN" > "$COPR_CONFIG"
          python3 - <<'PY'
          import os
          import subprocess
          from copr.v3 import Client
          from copr.v3.exceptions import CoprNoResultException

          client = Client.create_from_config_file(os.environ["COPR_CONFIG"])
          chroots = ["fedora-44-x86_64", "fedora-44-aarch64"]
          available = client.mock_chroot_proxy.get_list()
          missing = set(chroots) - set(available)
          if missing:
              raise SystemExit(f"Required COPR chroots unavailable: {sorted(missing)}")
          try:
              client.project_proxy.get("alperhan", "crossmacro-dev")
          except CoprNoResultException:
              operation = "create"
          else:
              operation = "modify"
          subprocess.run([
              "copr-cli", "--config", os.environ["COPR_CONFIG"], operation,
              "alperhan/crossmacro-dev", "--enable-net", "on",
              "--chroot", chroots[0], "--chroot", chroots[1],
          ], check=True)
          PY
          copr-cli --config "$COPR_CONFIG" buildscm alperhan/crossmacro-dev \
            --clone-url https://github.com/alper-han/CrossMacro.git \
            --type git \
            --commit "$SOURCE_SHA" \
            --method make_srpm \
            --spec scripts/packaging/rpm/crossmacro.spec \
            --chroot fedora-44-x86_64 --chroot fedora-44-aarch64

      - name: Cleanup COPR credentials
        if: always()
        env:
          COPR_CONFIG: ${{ runner.temp }}/crossmacro-copr-dev.conf
        run: rm -f "$COPR_CONFIG"
